<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="SectorPulse">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="45%" stop-color="#121821"/>
      <stop offset="100%" stop-color="#151C27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE6A6"/>
      <stop offset="40%" stop-color="#4DA3FF"/>
      <stop offset="70%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#FF5C7A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2EE6A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EE6A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="40" r="120" fill="#2EE6A6" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1080" cy="200" r="90" fill="#4DA3FF" opacity="0.14" filter="url(#soft)"/>
  <circle cx="160" cy="220" r="100" fill="#F0B429" opacity="0.08" filter="url(#soft)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <text x="72" y="118" fill="#2EE6A6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="4">SECTORPULSE</text>
  <text x="72" y="168" fill="#E8EEF7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Resilient file recovery from damaged Windows drives</text>
  <text x="72" y="214" fill="#8B9BB0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">USB detect · Raw NTFS · Bad-sector skip · Resume journals · PDF / video repair</text>
  <!-- pulse bars -->
  <g transform="translate(920, 95)" opacity="0.95">
    <rect x="0" y="40" width="14" height="40" rx="4" fill="#2EE6A6"/>
    <rect x="22" y="20" width="14" height="60" rx="4" fill="#3DFFC0"/>
    <rect x="44" y="8" width="14" height="72" rx="4" fill="#4DA3FF"/>
    <rect x="66" y="28" width="14" height="52" rx="4" fill="#F0B429"/>
    <rect x="88" y="14" width="14" height="66" rx="4" fill="#FF5C7A"/>
    <rect x="110" y="36" width="14" height="44" rx="4" fill="#2EE6A6"/>
    <rect x="132" y="22" width="14" height="58" rx="4" fill="#4DA3FF"/>
  </g>
</svg>
